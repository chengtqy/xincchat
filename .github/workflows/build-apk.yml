name: 构建 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: |
          cd xingchen-chat
          npm install

      - name: 同步前端到 Android
        run: |
          cd xingchen-chat
          npx cap copy android

      - name: 构建 APK
        run: |
          cd xingchen-chat/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-chat-apk
          path: xingchen-chat/android/app/build/outputs/apk/debug/app-debug.apk
