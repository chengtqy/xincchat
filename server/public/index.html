<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星辰Chat</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --g-bg:rgba(255,255,255,.55);--g-bg2:rgba(255,255,255,.35);--g-border:rgba(255,255,255,.45);
  --g-txt:#1e293b;--g-txt2:#64748b;--g-acc:#3b82f6;--g-acc-l:rgba(59,130,246,.1);
  --g-radius:16px;--g-blur:20px;--g-anim:0.24s;--g-sat:150%;--g-bright:100%;
  --gc1:#dbeafe;--gc2:#ffffff;--gd:135deg;--go:1;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;color:var(--g-txt);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(var(--gd),var(--gc1),var(--gc2));background-attachment:fixed;opacity:var(--go)}

/* === THEME: Liquid Glass (Redesigned) === */
/* Inspired by liquid-glass.ybouane.com: refraction, chromatic aberration,
   edge highlights, 3D bevel, floating shadows, specular reflection */
:root{--lg-edge:rgba(255,255,255,.7);--lg-depth:rgba(0,0,0,.08);--lg-refract:rgba(120,180,255,.06);--lg-chroma-r:rgba(255,80,80,.035);--lg-chroma-b:rgba(80,80,255,.035)}
[data-glass="liquid-glass"] .glass{
  background:linear-gradient(135deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.22) 45%,rgba(255,255,255,.32) 100%);
  backdrop-filter:blur(var(--g-blur)) saturate(calc(var(--g-sat) * .9)) brightness(calc(var(--g-bright) * 1.02));
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(calc(var(--g-sat) * .9)) brightness(calc(var(--g-bright) * 1.02));
  border:1px solid rgba(255,255,255,.52);
  box-shadow:
    0 1px 2px rgba(0,0,0,.02),
    0 4px 8px rgba(0,0,0,.03),
    0 12px 24px rgba(0,0,0,.04),
    0 28px 56px rgba(0,0,0,.025),
    -0.5px 0 0 var(--lg-chroma-r),
    0.5px 0 0 var(--lg-chroma-b),
    inset 0 1px 1px var(--lg-edge),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -1px 2px rgba(0,0,0,.03),
    inset 1px 0 1px rgba(255,255,255,.12),
    inset -1px 0 1px rgba(255,255,255,.08);
  position:relative;overflow:hidden;
  transform:translateZ(0);will-change:transform}
[data-glass="liquid-glass"] .glass::before{
  content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;
  background:
    radial-gradient(ellipse 90px 70px at 28% 18%,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 40%,transparent 70%),
    radial-gradient(ellipse 50px 35px at 72% 65%,rgba(255,255,255,.1) 0%,transparent 55%),
    conic-gradient(from 45deg at 50% 50%,transparent 0deg,rgba(255,255,255,.07) 50deg,transparent 100deg,rgba(255,255,255,.04) 170deg,transparent 220deg,rgba(255,255,255,.05) 300deg,transparent 360deg);
  animation:liquidShimmer 14s ease-in-out infinite;pointer-events:none;z-index:1}
[data-glass="liquid-glass"] .glass::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.22) 0%,transparent 35%,transparent 75%,rgba(255,255,255,.08) 100%);
  pointer-events:none;z-index:1}
[data-glass="liquid-glass"] .glass-sm{
  background:linear-gradient(140deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.28) 100%);
  backdrop-filter:blur(calc(var(--g-blur) * .65)) saturate(var(--g-sat)) brightness(var(--g-bright));
  -webkit-backdrop-filter:blur(calc(var(--g-blur) * .65)) saturate(var(--g-sat)) brightness(var(--g-bright));
  border:1px solid rgba(255,255,255,.45);
  box-shadow:
    0 2px 4px rgba(0,0,0,.015),
    0 8px 16px rgba(0,0,0,.03),
    0 16px 32px rgba(0,0,0,.02),
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -1px 1px rgba(0,0,0,.02)}
/* Liquid glass: capsule bottom bar */
[data-glass="liquid-glass"] .capsule-wrap{
  background:linear-gradient(135deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.28) 100%);
  border:1px solid rgba(255,255,255,.48);
  box-shadow:
    0 4px 12px rgba(0,0,0,.04),
    0 16px 40px rgba(0,0,0,.06),
    inset 0 1px 1px rgba(255,255,255,.55),
    inset 0 -1px 1px rgba(0,0,0,.02),
    -0.5px 0 0 var(--lg-chroma-r),
    0.5px 0 0 var(--lg-chroma-b)}
/* Liquid glass: bottom bar (non-capsule) */
[data-glass="liquid-glass"] .bar-b:not(.capsule){
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.25) 100%);
  border-top:1px solid rgba(255,255,255,.5);
  box-shadow:0 -4px 20px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.5)}
/* Liquid glass: chat capsule */
[data-glass="liquid-glass"] .chat-capsule{
  background:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.45) 50%,rgba(255,255,255,.55) 100%);
  backdrop-filter:blur(28px) saturate(180%) brightness(102%);
  -webkit-backdrop-filter:blur(28px) saturate(180%) brightness(102%);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:0 4px 12px rgba(0,0,0,.04),0 16px 40px rgba(0,0,0,.06),inset 0 1px 1px rgba(255,255,255,.55),-0.5px 0 0 var(--lg-chroma-r),0.5px 0 0 var(--lg-chroma-b)}
[data-glass="liquid-glass"] .emoji-grid{
  background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.28) 100%);
  border:1px solid rgba(255,255,255,.48);
  box-shadow:0 -4px 16px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.03)}
/* Liquid glass: icon button */
[data-glass="liquid-glass"] .icon-btn{
  background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.2) 100%);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 2px 8px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5)}
/* Liquid glass: input fields */
[data-glass="liquid-glass"] .gi{
  background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.18) 100%);
  border:1.5px solid rgba(255,255,255,.42);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.02),inset 0 -1px 0 rgba(255,255,255,.3)}
/* Liquid glass: send button enhanced */
[data-glass="liquid-glass"] .send-btn{
  box-shadow:0 4px 16px rgba(59,130,246,.35),0 2px 4px rgba(99,102,241,.2),inset 0 1px 0 rgba(255,255,255,.25)}
/* Liquid glass: bubbles */
[data-glass="liquid-glass"] .bubble-o{
  background:linear-gradient(140deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.25) 100%);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 2px 8px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5)}
[data-glass="liquid-glass"] .bubble-s{
  box-shadow:0 4px 16px rgba(59,130,246,.28),0 2px 4px rgba(99,102,241,.15),inset 0 1px 0 rgba(255,255,255,.2)}
[data-glass="liquid-glass"] .bubble-ai{
  box-shadow:0 4px 16px rgba(139,92,246,.28),0 2px 4px rgba(99,102,241,.15),inset 0 1px 0 rgba(255,255,255,.2)}
/* Liquid glass: dialog & context */
[data-glass="liquid-glass"] .dialog-box{
  background:linear-gradient(160deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.68) 100%);
  box-shadow:0 8px 32px rgba(0,0,0,.08),0 24px 64px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.02)}
[data-glass="liquid-glass"] .ctx-menu{
  background:linear-gradient(160deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.72) 100%);
  box-shadow:0 8px 24px rgba(0,0,0,.06),0 16px 48px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.6)}
/* Liquid glass: auth form */
[data-glass="liquid-glass"] .auth-tabs{
  background:linear-gradient(135deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.15) 100%);
  border:1px solid rgba(255,255,255,.38)}
[data-glass="liquid-glass"] .auth-tab-slider{
  background:linear-gradient(135deg,rgba(59,130,246,.88) 0%,rgba(99,102,241,.88) 100%);
  box-shadow:0 2px 10px rgba(59,130,246,.3),0 6px 20px rgba(99,102,241,.18),inset 0 1px 0 rgba(255,255,255,.25)}
/* Liquid glass: color presets */
[data-glass="liquid-glass"] .color-preset{
  box-shadow:0 2px 8px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.4)}
/* Liquid glass: avatar depth */
[data-glass="liquid-glass"] .avatar{
  box-shadow:0 2px 8px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06)}
/* Liquid glass: session item hover glow */
[data-glass="liquid-glass"] .sess-item:hover{
  background:linear-gradient(135deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.15) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 2px 8px rgba(0,0,0,.03)}
/* Liquid glass: toast */
[data-glass="liquid-glass"] .toast{
  box-shadow:0 4px 16px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.2)}
/* Liquid glass: button primary */
[data-glass="liquid-glass"] .btn-p{
  box-shadow:0 4px 16px rgba(59,130,246,.3),0 8px 24px rgba(99,102,241,.15),inset 0 1px 0 rgba(255,255,255,.2)}
[data-glass="liquid-glass"] .btn-danger{
  box-shadow:0 4px 16px rgba(239,68,68,.3),0 8px 24px rgba(220,38,38,.12),inset 0 1px 0 rgba(255,255,255,.2)}
/* Liquid glass: toggle switch */
[data-glass="liquid-glass"] .toggle-sw .thumb{
  box-shadow:0 2px 6px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08)}
@keyframes liquidShimmer{
  0%{transform:translate(0,0) rotate(0deg)}
  20%{transform:translate(4%,2%) rotate(2deg)}
  45%{transform:translate(-2%,4%) rotate(-1.5deg)}
  70%{transform:translate(3%,-2%) rotate(1deg)}
  100%{transform:translate(0,0) rotate(0deg)}}

/* === THEME: Frosted === */
[data-glass="frosted"] .glass{background:rgba(255,255,255,.72);backdrop-filter:blur(calc(var(--g-blur)*.6)) saturate(var(--g-sat)) brightness(var(--g-bright));-webkit-backdrop-filter:blur(calc(var(--g-blur)*.6)) saturate(var(--g-sat)) brightness(var(--g-bright));border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 20px rgba(0,0,0,.05)}
[data-glass="frosted"] .glass::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 60%);pointer-events:none}
[data-glass="frosted"] .glass-sm{background:rgba(255,255,255,.55);backdrop-filter:blur(calc(var(--g-blur)*.4)) saturate(var(--g-sat)) brightness(var(--g-bright));-webkit-backdrop-filter:blur(calc(var(--g-blur)*.4)) saturate(var(--g-sat)) brightness(var(--g-bright));border:1px solid rgba(255,255,255,.5);box-shadow:0 2px 10px rgba(0,0,0,.03)}

/* === THEME: Acrylic === */
[data-glass="acrylic"] .glass{background:rgba(139,92,246,.08);backdrop-filter:blur(calc(var(--g-blur)*.5)) saturate(var(--g-sat)) brightness(var(--g-bright));-webkit-backdrop-filter:blur(calc(var(--g-blur)*.5)) saturate(var(--g-sat)) brightness(var(--g-bright));border:1px solid rgba(139,92,246,.15);box-shadow:0 8px 32px rgba(139,92,246,.08),0 2px 8px rgba(0,0,0,.04)}
[data-glass="acrylic"] .glass::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;opacity:.6}
[data-glass="acrylic"] .glass-sm{background:rgba(139,92,246,.05);backdrop-filter:blur(calc(var(--g-blur)*.35)) saturate(var(--g-sat)) brightness(var(--g-bright));-webkit-backdrop-filter:blur(calc(var(--g-blur)*.35)) saturate(var(--g-sat)) brightness(var(--g-bright));border:1px solid rgba(139,92,246,.1);box-shadow:0 4px 16px rgba(139,92,246,.05)}

/* === THEME: Solid === */
[data-glass="solid"] .glass{background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 12px rgba(0,0,0,.06)}
[data-glass="solid"] .glass::before{display:none}
[data-glass="solid"] .glass-sm{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.05);box-shadow:0 1px 6px rgba(0,0,0,.04)}

/* Glass shared */
.glass,.glass-sm{border-radius:var(--g-radius);transition:all var(--g-anim) ease}
.glass{padding:16px}.glass-sm{padding:12px}
.glass:active,.glass-sm:active{transform:scale(.985)}

/* === Views === */
.view{position:fixed;inset:0;display:none;flex-direction:column;background:transparent;z-index:1}
.view.active{display:flex;animation:viewIn var(--g-anim) ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* === Header === */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0;min-height:56px;position:relative}
.hdr-title{flex:1;min-width:0;font-size:17px;font-weight:700;color:var(--g-txt)}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--g-bg2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--g-border);cursor:pointer;color:var(--g-txt);transition:all .15s ease;flex-shrink:0}
.icon-btn:active{transform:scale(.9);opacity:.7}
/* === AI Float Button === */
.ai-fab{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent}
.ai-fab:active .ai-fab-circle{transform:scale(.88)}
.ai-fab-circle{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s ease;color:#fff}
.ai-fab-circle svg{width:20px;height:20px}
.ai-fab-label{font-size:9px;font-weight:600;color:#8b5cf6;white-space:nowrap;letter-spacing:.3px}

/* === Scroll Area === */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px 0;padding-bottom:calc(16px + var(--safe-b))}
.scroll::-webkit-scrollbar{width:0}

/* === Bottom Bar === */
.bar-b{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 12px;padding-bottom:calc(6px + var(--safe-b));background:var(--g-bg);backdrop-filter:blur(var(--g-blur));-webkit-backdrop-filter:blur(var(--g-blur));border-top:1px solid var(--g-border);display:flex;align-items:stretch;justify-content:space-around;transition:all var(--g-anim) ease}
.bar-b.capsule{background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;justify-content:center;padding:10px 20px;padding-bottom:calc(10px + var(--safe-b))}
.capsule-wrap{display:flex;align-items:center;background:var(--g-bg);backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright));-webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright));border:1px solid var(--g-border);border-radius:28px;padding:4px 6px;box-shadow:0 8px 32px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.4);gap:2px;max-width:360px;width:100%}
.bar-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;flex:1;cursor:pointer;color:var(--g-txt2);transition:all .2s ease;min-width:0;border-radius:12px;position:relative}
.bar-item:active{transform:scale(.9)}
.bar-item.active{color:var(--g-acc)}
.bar-item .bi-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s ease}
.bar-item.active .bi-icon{transform:scale(1.1)}
.bar-item .bi-label{font-size:10px;font-weight:500;white-space:nowrap}
.bar-item .bi-badge{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1}

/* === Login === */
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:24px}
.auth-logo{width:80px;height:80px;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px rgba(59,130,246,.25),0 4px 12px rgba(139,92,246,.15);animation:logoFloat 3s ease-in-out infinite}
.auth-logo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.auth-title{font-size:26px;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.auth-tabs{display:flex;position:relative;margin-bottom:8px;border-radius:50px;background:var(--g-bg2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--g-border);padding:4px;gap:0}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;color:var(--g-txt2);transition:color .28s ease;border:none;background:transparent;border-radius:46px;position:relative;z-index:2}
.auth-tab.active{color:#fff}
.auth-tab-slider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:46px;background:var(--g-acc);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:1;box-shadow:0 2px 10px rgba(59,130,246,.35)}
.auth-tab-slider.r{transform:translateX(100%)}
.gi{width:100%;padding:12px 16px;border-radius:var(--g-radius);border:1.5px solid rgba(0,0,0,.1);background:rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;color:var(--g-txt);outline:none;transition:all .2s ease}
.gi:focus{border-color:var(--g-acc);box-shadow:0 0 0 3px var(--g-acc-l)}
.gi::placeholder{color:var(--g-txt2);opacity:.6}
.btn{padding:12px 20px;border-radius:var(--g-radius);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s ease;color:#fff}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 4px 16px rgba(59,130,246,.3)}
.btn-p:active{box-shadow:0 2px 8px rgba(59,130,246,.2)}
.btn-g{background:var(--g-bg2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--g-border);color:var(--g-txt)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 16px rgba(239,68,68,.3)}
.auth-fields{display:flex;flex-direction:column;gap:12px;transition:opacity .28s cubic-bezier(.4,0,.2,1),transform .28s cubic-bezier(.4,0,.2,1);will-change:opacity,transform}
.auth-err{font-size:12px;color:#ef4444;min-height:18px;text-align:center}
.pwd-bar-wrap{display:flex;gap:4px;align-items:center}
.pwd-bar{flex:1;height:4px;border-radius:2px;background:var(--g-bg2);transition:background .3s}
.pwd-bar-wrap.l1 .pwd-bar:nth-child(1),.pwd-bar-wrap.l2 .pwd-bar:nth-child(-n+2),.pwd-bar-wrap.l3 .pwd-bar:nth-child(-n+3),.pwd-bar-wrap.l4 .pwd-bar:nth-child(-n+4),.pwd-bar-wrap.l5 .pwd-bar{background:var(--pwd-c,#ef4444)}
.pwd-label{font-size:11px;min-width:32px;text-align:right;color:var(--pwd-c,#ef4444);font-weight:500;transition:color .3s}

/* === Avatar === */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}

/* === Session List === */
.cl-search{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
.cl-search-input{flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:50px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(0,0,0,.1);transition:all .2s ease}
.cl-search-input:focus-within{border-color:var(--g-acc);box-shadow:0 0 0 3px var(--g-acc-l)}
.cl-search-input svg{width:16px;height:16px;color:var(--g-txt2);flex-shrink:0}
.cl-search-input input{flex:1;border:none;background:transparent;font-size:14px;color:var(--g-txt);outline:none}
.cl-search-input input::placeholder{color:var(--g-txt2);opacity:.6}

/* ===== 星辰Chat API 客户端 ===== */
var API={
  base:'https://784767d99cd58c66-180-76-117-87.serveousercontent.com',
  token:null,
  loadToken:function(){try{this.token=localStorage.getItem('xc_token')||null}catch(e){}return this.token},
  setToken:function(t){this.token=t;try{localStorage.setItem('xc_token',t)}catch(e){}},
  clearToken:function(){this.token=null;try{localStorage.removeItem('xc_token')}catch(e){}},
  req:function(method,path,body){
    var self=this;
    return new Promise(function(resolve,reject){
      var xhr=new XMLHttpRequest();
      xhr.open(method,self.base+'/api'+path);
      xhr.setRequestHeader('Content-Type','application/json');
      if(self.token)xhr.setRequestHeader('Authorization','Bearer '+self.token);
      xhr.onreadystatechange=function(){
        if(xhr.readyState===4){
          try{var r=JSON.parse(xhr.responseText);
            if(r.code===0)resolve(r.data);
            else reject(r);
          }catch(e){reject({msg:'网络错误',code:-1})}
        }
      };
      xhr.send(body?JSON.stringify(body):null);
    });
  }
};
API.loadToken();

/* Socket.IO 实时通信 */
var socket=null;
var onlineFriends={};
function initSocket(){
  if(!API.token)return;
  socket=io(API.base,{auth:{token:API.token},transports:['websocket','polling']});
  socket.on('connect',function(){console.log('[Socket] 已连接')});
  socket.on('disconnect',function(){console.log('[Socket] 已断开')});

  // 收到新消息
  socket.on('new_message',function(msg){
    var sid=getSessionId(msg.senderId);
    if(!S.messages[sid])S.messages[sid]=[];
    // 避免重复
    for(var i=0;i<S.messages[sid].length;i++){
      if(S.messages[sid][i].id===msg.id)return;
    }
    var senderName=getContactName(msg.senderId)||'用户';
    S.messages[sid].push({id:msg.id,sid:sid,from:msg.senderId,fn:senderName,type:msg.msgType,text:msg.content,t:msg.createdAt});
    // 更新会话
    var sess=findSession(sid);
    if(sess){
      sess.last=msg.content;
      sess.time=msg.createdAt;
      if(S.view!=='chat'||S.activeSid!==sid)sess.unread=(sess.unread||0)+1;
    }else{
      // 新会话
      S.sessions.push({id:sid,type:'p',cid:msg.senderId,name:senderName,last:msg.content,time:msg.createdAt,unread:1,pin:false,mute:false});
    }
    if(S.view==='chat'&&S.activeSid===sid){
      renderMessages();
      socket.emit('mark_read',{otherId:msg.senderId});
    }else{
      renderMain();
    }
  });

  // 好友上线/离线
  socket.on('friend_status',function(data){
    onlineFriends[data.userId]=data.online;
  });

  // 正在输入
  socket.on('typing',function(data){
    if(S.view==='chat'&&S.activeSid){
      var sess=findSession(S.activeSid);
      if(sess&&sess.cid===data.from){
        var hdr=document.getElementById('chat-header');
        if(hdr){
          var sub=hdr.querySelector('div div div');
          if(sub){sub.textContent=data.username+' 正在输入...';sub.style.color='var(--g-acc)'}
        }
      }
    }
  });
  socket.on('stop_typing',function(data){
    if(S.view==='chat'&&S.activeSid){
      var sess=findSession(S.activeSid);
      if(sess&&sess.cid===data.from){
        var hdr=document.getElementById('chat-header');
        if(hdr){
          var sub=hdr.querySelector('div div div');
          if(sub){sub.textContent='';sub.style.color='var(--g-txt2)'}
        }
      }
    }
  });
}

function getSessionId(otherUserId){return 'p-'+otherUserId}
function findSession(sid){for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===sid)return S.sessions[i]}return null}
function getContactName(uid){
  for(var i=0;i<S.contacts.length;i++){if(S.contacts[i].id===uid)return S.contacts[i].name}
  // 也从会话里找
  for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].cid===uid)return S.sessions[i].name}
  return null;
}

function addFriendFromDetail(cid){if(isFriend(cid)){showToast('已经是好友了','warn');return}if(isBlocked(cid)){showToast('请先解除拉黑','warn');return}addFriendDirect(cid);showToast('已添加好友','success');renderContactDetail()}
function toggleSessMute(sid){toggleMute(sid);renderContactDetail()}
function toggleSessPin(sid){if(S.sessions){for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===sid){if(S.sessions[i].pin)unpinSession(sid);else pinSession(sid);break}}renderContactDetail()}}
function removeFriend(cid){showDialog('删除好友','确定要删除此好友吗？删除后聊天记录也会被清除。',function(){API.req('POST','/friends/delete',{friendId:cid}).then(function(){S.contacts=S.contacts.filter(function(c){return c.id!==cid});if(S.user.friends)S.user.friends=S.user.friends.filter(function(x){return x!==cid});var sid='p-'+cid;S.sessions=S.sessions.filter(function(x){return x.id!==sid});delete S.messages[sid];saveUser();showToast('已删除好友','success');goBack()}).catch(function(e){showToast(e.msg||'删除失败','error')})})}
function blockContact(cid){showDialog('拉黑联系人','拉黑后将无法接收对方消息，联系人中也不再显示。确定拉黑吗？',function(){if(!S.user.blocked)S.user.blocked=[];S.user.blocked.push(cid);if(S.user.friends)S.user.friends=S.user.friends.filter(function(x){return x!==cid});var sid='p-'+cid;S.sessions=S.sessions.filter(function(x){return x.id!==sid});delete S.messages[sid];saveUser();showToast('已拉黑该联系人','warn');goBack()})}
function unblockContact(cid){showDialog('解除拉黑','确定要解除对该联系人的拉黑吗？',function(){if(!S.user.blocked)return;S.user.blocked=S.user.blocked.filter(function(x){return x!==cid});saveUser();showToast('已解除拉黑','success');if(S.view==='blocked-list')renderBlockedList();else if(S.view==='contact-detail')renderContactDetail()})}
function openChatFromDetail(cid){var sid='p-'+cid;var sess=findSession(sid);if(!sess){var ct=getContact(cid);if(!ct)return;sess={id:sid,type:'p',cid:cid,name:ct.name,last:'',time:Date.now(),unread:0,pin:false,mute:false,avatarColor:ct.avatarColor};S.sessions.push(sess);S.messages[sid]=[]}S.activeSid=sid;sess.unread=0;S.view='chat';renderAll()}

var _momentImgs=[];
function renderMoments(){var el=document.getElementById('moments-panel');if(!el)return;var h='';var u=S.user||{};var list=S.moments.slice().reverse();if(list.length===0){h='<div class="empty-state"><div class="empty-state-icon">&#127760;</div><div class="empty-state-title">暂无动态</div><div class="empty-state-desc">点击右上角 + 发布你的第一条动态</div></div>';el.innerHTML=h;return}for(var i=0;i<list.length;i++){var m=list[i];h+='<div class="glass" style="margin-bottom:12px;padding:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+myAvatar(36)+'<div><div style="font-size:14px;font-weight:600;color:var(--g-txt)">'+(u.username||'我')+'</div><div style="font-size:11px;color:var(--g-txt2)">'+fmtTime(m.time)+'</div></div></div>';if(m.text)h+='<div style="font-size:14px;color:var(--g-txt);line-height:1.6;margin-bottom:8px;white-space:pre-wrap">'+escHtml(m.text)+'</div>';if(m.imgs&&m.imgs.length>0){h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';for(var j=0;j<m.imgs.length;j++){h+='<img src="'+m.imgs[j]+'" style="width:80px;height:80px;object-fit:cover;border-radius:10px" onclick="window.open(this.src)">'}h+='</div>'}h+='<div style="display:flex;align-items:center;gap:16px;padding-top:8px;border-top:1px solid rgba(0,0,0,.04)">';h+='<span style="font-size:12px;color:'+(m.liked?'#ef4444':'var(--g-txt2)')+';cursor:pointer" onclick="toggleLike(\''+m.id+'\')">&#10084; '+(m.liked?'已赞':'赞')+'</span>';h+='<span style="font-size:12px;color:var(--g-txt2);cursor:pointer" onclick="showCommentInput(\''+m.id+'\')">&#128172; 评论</span>';h+='<span style="font-size:12px;color:var(--g-txt2);cursor:pointer;margin-left:auto" onclick="deleteMoment(\''+m.id+'\')">&#128465;</span>';h+='</div>';if(m.comments&&m.comments.length>0){h+='<div style="margin-top:8px;padding:8px;background:rgba(0,0,0,.02);border-radius:8px">';for(var c=0;c<m.comments.length;c++){var cm=m.comments[c];h+='<div style="font-size:12px;color:var(--g-txt);line-height:1.5;margin-bottom:'+(c<m.comments.length-1?'4':'0')+'"><b>'+escHtml(cm.name)+'</b>: '+escHtml(cm.text)+'</div>'}h+='</div>'}h+='</div>'}el.innerHTML=h}
function toggleLike(id){for(var i=0;i<S.moments.length;i++){if(S.moments[i].id===id){S.moments[i].liked=!S.moments[i].liked;break}}saveAppState();renderMoments()}
function showCommentInput(id){var text=window.prompt&&null;var el=document.getElementById('moments-comment-inp');if(!el){var wrap=document.createElement('div');wrap.style.cssText='position:fixed;bottom:70px;left:16px;right:16px;z-index:50;display:flex;gap:8px';wrap.innerHTML='<input id="moments-comment-inp" class="gi" placeholder="写评论..." style="flex:1"><button class="btn btn-p" style="padding:10px 16px;font-size:13px" onclick="submitComment()">发送</button>';document.body.appendChild(wrap);el=document.getElementById('moments-comment-inp');el.focus()}el.focus();el.setAttribute('data-mid',id)}
function submitComment(){var el=document.getElementById('moments-comment-inp');if(!el)return;var text=el.value.trim();var mid=el.getAttribute('data-mid');if(!text||!mid)return;for(var i=0;i<S.moments.length;i++){if(S.moments[i].id===mid){if(!S.moments[i].comments)S.moments[i].comments=[];S.moments[i].comments.push({name:S.user?S.user.username:'我',text:text});break}}var wrap=el.parentElement;if(wrap)wrap.remove();saveAppState();renderMoments()}
function deleteMoment(id){showDialog('删除动态','确定要删除这条动态吗？',function(){S.moments=S.moments.filter(function(m){return m.id!==id});saveAppState();renderMoments();showToast('已删除','success')})}
function renderPostMoment(){var el=document.getElementById('moment-text');if(el)el.value='';_momentImgs=[];var pv=document.getElementById('moment-img-preview');if(pv)pv.innerHTML=''}

function removeMomentImg(idx){_momentImgs.splice(idx,1);var pv=document.getElementById('moment-img-preview');if(pv){var h='';for(var j=0;j<_momentImgs.length;j++){h+='<div style="position:relative"><img src="'+_momentImgs[j]+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px"><span style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="removeMomentImg('+j+')">&#10005;</span></div>'}pv.innerHTML=h}}
function doPostMoment(){var el=document.getElementById('moment-text');var text=el?el.value.trim():'';if(!text&&_momentImgs.length===0){showToast('请输入内容或添加图片','warn');return}S.moments.push({id:gid(),text:text,imgs:_momentImgs.slice(),time:Date.now(),liked:false,comments:[]});_momentImgs=[];saveAppState();goBack();showToast('动态已发布','success')}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

var _readPages={disclaimer:false,privacy:false,community:false};
var _readStart={};
function showRegPage(page){
  _readStart[page]=Date.now();
  S._regReading=page;
  goView(page);
}
function markReadLink(page){
  var elapsed=Date.now()-_readStart[page];
  if(elapsed>=10000){
    _readPages[page]=true;
    _checkAllRead();
  }else{
    showToast('请阅读至少10秒','warn');
  }
}
function _checkAllRead(){
  var count=(_readPages.disclaimer?1:0)+(_readPages.privacy?1:0)+(_readPages.community?1:0);
  var allDone=_readPages.disclaimer&&_readPages.privacy&&_readPages.community;
  S.view='login';S.authMode='register';renderAll();
  _restoreRegForm();
  if(allDone){
    var chk=document.getElementById('agree-check');
    var btn=document.getElementById('reg-btn');
    if(chk){chk.disabled=false;chk.checked=true}
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer'}
    showToast('所有协议已阅读完毕，请完成注册','success');
  }else{
    _updateReadLinks();
    showToast('已阅读 '+count+'/3，请继续阅读剩余协议','info');
  }
}
var _regFormData={};
function _saveRegForm(){
  var u=document.getElementById('reg-user');var p=document.getElementById('reg-pass');
  var p2=document.getElementById('reg-pass2');var ph=document.getElementById('reg-phone');var em=document.getElementById('reg-email');
  _regFormData={username:u?u.value:'',password:p?p.value:'',password2:p2?p2.value:'',phone:ph?ph.value:'',email:em?em.value:''};
}
function _restoreRegForm(){
  setTimeout(function(){
    var u=document.getElementById('reg-user');var p=document.getElementById('reg-pass');
    var p2=document.getElementById('reg-pass2');var ph=document.getElementById('reg-phone');var em=document.getElementById('reg-email');
    if(u&&_regFormData.username)u.value=_regFormData.username;
    if(p&&_regFormData.password){p.value=_regFormData.password;if(typeof checkPwd==='function')checkPwd(p)}
    if(p2&&_regFormData.password2)p2.value=_regFormData.password2;
    if(ph&&_regFormData.phone)ph.value=_regFormData.phone;
    if(em&&_regFormData.email)em.value=_regFormData.email;
  },50);
}
function _updateReadLinks(){
  var pages=['disclaimer','privacy','community'];
  for(var i=0;i<pages.length;i++){
    if(_readPages[pages[i]]){
      var links=document.querySelectorAll('.reg-agreement-link[data-page="'+pages[i]+'"]');
      for(var j=0;j<links.length;j++){links[j].style.color='var(--g-txt2)';links[j].style.textDecoration='line-through'}
    }
  }
}

/* 从后端加载真实数据 */
async function loadAllData(){
  try{
    /* 加载好友列表 */
    var friends=await API.req('GET','/friends/list');
    S.contacts=(friends||[]).map(function(f){
      return{id:f.id,nid:f.nid,name:f.username,py:f.username,status:onlineFriends[f.id]?'在线':'离线',avatarColor:f.avatarColor,avatarB64:f.avatarB64};
    });
    if(!S.user.friends)S.user.friends=[];
    S.user.friends=S.contacts.map(function(c){return c.id});

    /* 加载会话列表 */
    var sessions=await API.req('GET','/messages/sessions');
    S.sessions=[];
    S.messages={};
    for(var i=0;i<(sessions||[]).length;i++){
      var sess=sessions[i];
      var sid='p-'+sess.user.id;
      S.sessions.push({id:sid,type:'p',cid:sess.user.id,name:sess.user.username,last:sess.lastMessage?sess.lastMessage.content:'',time:sess.lastTime||Date.now(),unread:sess.unreadCount||0,pin:false,mute:false});
      S.messages[sid]=[];
    }

    /* 加载好友请求 */
    var requests=await API.req('GET','/friends/requests');
    S.friendRequests=requests||[];

    saveUser();
    renderAll();
  }catch(e){console.error('加载数据失败',e)}
}

/* 加载好友列表到contacts */
async function loadFriendsList(){
  try{
    var friends=await API.req('GET','/friends/list');
    S.contacts=(friends||[]).map(function(f){
      return{id:f.id,nid:f.nid,name:f.username,py:f.username,status:onlineFriends[f.id]?'在线':'离线',avatarColor:f.avatarColor,avatarB64:f.avatarB64};
    });
    if(S.user){
      S.user.friends=S.contacts.map(function(c){return c.id});
      saveUser();
    }
  }catch(e){console.error('加载好友失败',e)}
}

/* 添加好友到本地列表 */
function addFriendToList(user){
  S.contacts.push({id:user.id,nid:user.nid,name:user.username,py:user.username,status:'在线',avatarColor:user.avatarColor||acolor(user.username),avatarB64:user.avatarB64});
  if(!S.user.friends)S.user.friends=[];
  S.user.friends.push(user.id);
  saveUser();
  var sid='p-'+user.id;
  var exists=false;
  for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===sid){exists=true;break}}
  if(!exists){S.sessions.push({id:sid,type:'p',cid:user.id,name:user.username,last:'已添加为好友，开始聊天吧！',time:Date.now(),unread:0,pin:false,mute:false});S.messages[sid]=[]}
}

if(API.token){
  /* 已登录 - 验证token有效性 */
  API.req('GET','/auth/me').then(function(user){
    S.user={id:user.id,nid:user.nid,username:user.username,avatarColor:user.avatarColor,avatarB64:user.avatarB64,bio:user.bio,friends:[],blocked:[]};

function openSessCtx(sId,x,y){var s=null;for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===sId){s=S.sessions[i];break}}if(!s)return;var items=[];if(s.pin)items.push({icon:'&#128204;',label:'取消置顶',action:function(){unpinSession(sId)}});else items.push({icon:'&#128204;',label:'置顶聊天',action:function(){pinSession(sId)}});if(s.mute)items.push({icon:'&#128266;',label:'开启通知',action:function(){toggleMute(sId)}});else items.push({icon:'&#128263;',label:'消息免打扰',action:function(){toggleMute(sId)}});items.push({icon:'&#128465;',label:'删除聊天',danger:true,action:function(){deleteSession(sId)}});showCtxMenu(x,y,items)}
var _lpTimer=null;var _lpFired=false;var _ctxOpenTime=0;
document.addEventListener('touchstart',function(e){var item=e.target.closest('.sess-item');if(!item)return;_lpFired=false;_lpTimer=setTimeout(function(){_lpFired=true;var t=e.changedTouches[0];openSessCtx(item.getAttribute('data-sid'),t.clientX,t.clientY)},500)},{passive:true});
document.addEventListener('touchmove',function(){if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null}},{passive:true});
document.addEventListener('touchend',function(e){if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null}if(_lpFired){e.preventDefault();_lpFired=false}},{passive:false});
document.addEventListener('contextmenu',function(e){var item=e.target.closest('.sess-item');if(!item)return;e.preventDefault();openSessCtx(item.getAttribute('data-sid'),e.clientX,e.clientY)});
function pinSession(id){for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===id){S.sessions[i].pin=true;break}}renderMain();showToast('已置顶','success')}
function unpinSession(id){for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===id){S.sessions[i].pin=false;break}}renderMain();showToast('已取消置顶')}
function toggleMute(id){for(var i=0;i<S.sessions.length;i++){if(S.sessions[i].id===id){S.sessions[i].mute=!S.sessions[i].mute;var m=S.sessions[i].mute;break}}renderMain();showToast(m?'已开启免打扰':'已关闭免打扰','info')}
function deleteSession(id){showDialog('删除聊天','确定删除该聊天记录吗？',function(){S.sessions=S.sessions.filter(function(x){return x.id!==id});delete S.messages[id];renderMain();showToast('已删除','success')})}

{title:'联系人与好友',desc:'<p>底部第二个Tab是"好友"，显示你的联系人列表。联系人按拼音首字母分组排列。</p><p>点击联系人可以查看详情、发送消息。</p><div class="tut-tip"><strong>隐藏功能 — 添加好友：</strong>点击好友页面右上角的蓝色圆形按钮，输入对方的昵称或ID即可发送好友请求。</p><p><strong>隐藏功能 — 拉黑联系人：</strong>进入联系人详情页，在底部可以找到"拉黑"选项。拉黑后对方无法给你发消息，也不会出现在你的联系人列表中。</p></div>'},
{title:'表情与互动',desc:'<p>在聊天界面底部输入框旁边有一个笑脸图标，点击即可打开表情面板。选择表情后会直接插入到输入框中。</p><p>每个联系人的聊天界面配色都不同，因为头像颜色是根据对方名字自动生成的，这让每个对话都有独特的视觉标识。</p><div class="tut-tip"><strong>提示：</strong>好友回复是模拟的智能回复，每个好友都有自己的回复风格。不同的好友回复内容和语气都不一样。</p></div>'},
{title:'发现页功能',desc:'<p>底部第三个Tab是"发现"，这里汇集了应用的扩展功能：</p><p><strong>动态圈：</strong>类似朋友圈，查看好友发布的动态，可以点赞、评论，也可以发布自己的图文动态。<br><strong>云相册：</strong>你的个人云端照片库，支持上传照片、自定义名称、保存到本地和删除。<br><strong>热门 / 搜索 / 日程 / 收藏 / 工具箱：</strong>更多功能正在开发中。</p><div class="tut-tip"><strong>隐藏功能 — 动态圈：</strong>在动态圈页面，点击右上角的"+"按钮可以发布新动态。你可以输入文字，也可以添加图片。发布的动态所有好友都能看到。</p><p><strong>隐藏功能 — 删除自己的动态：</strong>在自己发布的动态下方，长按可以删除。</p></div>'},
{title:'云相册详解',desc:'<p>云相册是你个人的照片管理空间，采用3列网格布局展示。</p><p><strong>上传照片：</strong>点击相册页面右上角的"+"按钮选择照片。上传时会弹出输入框让你自定义照片名称。<br><strong>查看照片：</strong>点击任意照片进入详情页，可以查看大图、上传时间。<br><strong>重命名：</strong>在照片详情页点击"重命名"按钮可以修改照片名称。<br><strong>保存到手机：</strong>点击"保存"按钮可以将照片下载到本地设备。</p><div class="tut-tip"><strong>隐藏功能 — 照片删除验证：</strong>删除照片需要经过安全验证，默认为三步验证：第一步输入账号密码，第二步输入注册时填写的邮箱，第三步确认删除。这样设计是为了防止误删重要照片。</p><p><strong>快捷删除：</strong>如果你觉得三步验证太麻烦，可以在"我的"页面的设置中找到"快捷删除"选项，开启后删除照片只需输入密码即可。</p><p><strong>存储容量：</strong>免费用户最多存储30张照片。签到获得VIP后可扩充到500张。相册页面顶部会显示当前用量和总容量进度条。</p></div>'},
{title:'VIP签到系统',desc:'<p>在"我的"页面中，你会看到一个金色边框的VIP胶囊标签，显示你的VIP状态和有效期。</p><p>点击它可以进入VIP签到页面。通过每天签到可以免费获得VIP会员资格：</p><p><strong>连续签到5天</strong> → 获得1天VIP<br><strong>连续签到6天</strong> → 获得5天VIP<br><strong>连续签到7天</strong> → 获得1个月VIP<br><strong>每满30天</strong> → 获得1个月VIP</p><div class="tut-tip"><strong>隐藏功能：</strong>VIP签到页面会显示最近7天的签到日历，已签到的日期会显示金色勾选标记。签到奖励规则表会实时显示你的进度和即将解锁的奖励。</p><p><strong>注意：</strong>如果中断签到（哪怕只断一天），连续天数会重新计算。所以尽量每天都来签到一下。</p></div>'},
{title:'个人资料与设置',desc:'<p>底部第四个Tab是"我的"，这里管理你的个人信息和各项设置。</p><p>点击顶部的头像和用户名区域可以进入"编辑资料"页面，修改用户名、更换头像颜色或上传自定义头像。</p><div class="tut-tip"><strong>隐藏功能 — 账号与安全：</strong>在设置列表中找到"账号与安全"，可以查看你的账号信息、专属ID、加密状态等。</p><p><strong>隐藏功能 — 主题风格：</strong>提供多种视觉主题可选，包括液态玻璃、毛玻璃、亚克力、纯色等不同风格。</p><p><strong>隐藏功能 — 视觉调节：</strong>可以调整全局圆润度、通透度、动画速度、色彩饱和度等参数，打造属于你自己的界面风格。</p><p><strong>隐藏功能 — 底栏自定义：</strong>可以调整底部导航栏的图标顺序、显示或隐藏某个Tab、添加快捷入口。</p></div>'},
{title:'协议与规则',desc:'<p>在设置页面的底部，你会看到一个"协议与规则"入口。点击可以展开查看三个独立协议：</p><p><strong>用户服务协议：</strong>应用的使用条款、账号管理规范、用户行为规范、知识产权声明、免责声明等。<br><strong>隐私政策：</strong>我们如何收集、使用、保护你的个人信息。你的所有数据都存储在本地设备中，不会上传至任何远程服务器。<br><strong>社区规范：</strong>动态圈、聊天、云相册的使用规则，以及违规处理措施。</p><div class="tut-tip"><strong>提示：</strong>新用户注册时需要阅读并同意以上所有协议才能完成注册。每个协议至少需要阅读10秒。已阅读的协议链接会显示灰色删除线标记。</p></div>'},
{title:'引导完成',desc:'<p>恭喜你已经了解了星辰Chat的所有主要功能和隐藏玩法！</p><p>以下是一些你可能感兴趣的功能快速入口：</p><div class="tut-tip"><strong>功能速查：</strong>发消息 → 消息Tab → 点击聊天<br>加好友 → 好友Tab → 右上角蓝色按钮<br>发动态 → 发现Tab → 动态圈 → 右上角+号<br>传照片 → 发现Tab → 云相册 → 右上角+号<br>VIP签到 → 我的Tab → VIP胶囊<br>改主题 → 我的Tab → 主题风格<br>快捷删除 → 我的Tab → 快捷删除开关</p></div><p>现在开始你的星辰Chat之旅吧！</p>'}
];

var _tutOverlay=null;
var _tutStep=0;

function startTutorial(){
  _tutStep=0;
  _createTutorialOverlay();
  document.getElementById('tutorial-root').style.display='block';
  _showTutorialStep();
}

function _createTutorialOverlay(){
  var root=document.getElementById('tutorial-root');
  root.innerHTML='<div class="tutorial-overlay" id="tut-overlay"><div class="tutorial-mask" id="tut-mask" onclick="_tutSkip()"></div><div class="tutorial-card" id="tut-card"></div></div>';
  _tutOverlay=document.getElementById('tut-overlay');
}

function _showTutorialStep(){
  var step=TUTORIAL_STEPS[_tutStep];
  if(!step){_endTutorial();return}
  var card=document.getElementById('tut-card');
  var isFirst=_tutStep===0;
  var isLast=_tutStep===TUTORIAL_STEPS.length-1;
  var h='';
  h+='<div class="tutorial-progress">';
  for(var i=0;i<TUTORIAL_STEPS.length;i++){
    var cls='tutorial-progress-dot';
    if(i<_tutStep)cls+=' done';
    else if(i===_tutStep)cls+=' active';
    h+='<div class="'+cls+'"></div>';
  }
  h+='</div>';
  h+='<div class="tutorial-card-header"><h3>'+step.title+'</h3><span class="tut-step-badge">'+(_tutStep+1)+' / '+TUTORIAL_STEPS.length+'</span></div>';
  h+='<div class="tutorial-card-body">'+step.desc+'</div>';
  h+='<div class="tutorial-card-footer">';
  if(!isFirst)h+='<button class="tutorial-btn-prev" onclick="_tutPrev()">上一步</button>';
  h+='<button class="tutorial-btn-skip" onclick="_tutSkip()">'+(isFirst?'跳过引导':'跳过')+'</button>';
  if(isLast)h+='<button class="tutorial-btn-done" onclick="_endTutorial()">完成</button>';
  else h+='<button class="tutorial-btn-next" onclick="_tutNext()">下一步</button>';
  h+='</div>';
  card.innerHTML=h;
  var body=card.querySelector('.tutorial-card-body');
  if(body)body.scrollTop=0;
}

function _tutNext(){
  if(_tutStep<TUTORIAL_STEPS.length-1){_tutStep++;_showTutorialStep()}
}
function _tutPrev(){
  if(_tutStep>0){_tutStep--;_showTutorialStep()}
}
function _tutSkip(){
  _endTutorial();
}
function _endTutorial(){
  S._tutorialDone=true;saveAppState();
  var root=document.getElementById('tutorial-root');
  root.style.display='none';root.innerHTML='';
  S.view='main';S.mainTab='chats';renderAll();
  showToast('新手引导完成！','success');
}

</script>
